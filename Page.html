<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reparador NVIDIA IA 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: linear-gradient(180deg, #0f0f1a 0%, #1a1a2e 100%); color: white; font-family: 'Segoe UI', sans-serif; }
        #ui-container { 
            position: absolute; top: 20px; left: 20px; z-index: 10; 
            background: rgba(15, 15, 30, 0.85); backdrop-filter: blur(12px);
            padding: 24px; border-radius: 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            width: 340px; border: 1px solid rgba(0,217,255,0.15);
        }
        h3 { margin-top: 0; font-size: 16px; color: #00d9ff; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        h3::before { content: "◆"; color: #00d9ff; }
        input[type="file"] { margin-bottom: 15px; width: 100%; color: #ddd; font-size: 12px; }
        input[type="file"]::file-selector-button { background: rgba(0,217,255,0.15); color: #00d9ff; border: 1px solid rgba(0,217,255,0.3); padding: 6px 12px; border-radius: 5px; cursor: pointer; margin-right: 10px; font-weight: bold; }
        button { width: 100%; padding: 12px; cursor: pointer; background: linear-gradient(135deg, #00d9ff, #0099cc); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; transition: all 0.25s; margin-bottom: 8px; }
        button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,217,255,0.4); }
        button:disabled { background: #2a2a3a; cursor: not-allowed; color: #555; }
        button.secondary { background: linear-gradient(135deg, #6b6bff, #4444cc); }
        button.ai-btn { background: linear-gradient(135deg, #b46bff, #9444cc); }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        .control-group { margin-top: 18px; }
        .control-group label { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; color: #aaa; text-transform: uppercase; }
        .control-group input[type="range"] { width: 100%; accent-color: #00d9ff; cursor: pointer; }
        .value-display { color: #00d9ff; font-weight: bold; font-family: 'Courier New', monospace; }
        .stats { margin-top: 20px; padding: 16px; background: rgba(0,0,0,0.4); border-radius: 10px; border-left: 3px solid #00d9ff; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
        .stat-label { color: #888; }
        .stat-value { color: #00d9ff; font-weight: bold; font-family: 'Courier New', monospace; font-size: 14px; }
        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(10,10,20,0.95); padding: 30px 50px; border-radius: 14px; display: none; z-index: 100; border: 1px solid rgba(180,107,255,0.4); text-align: center; }
        .loading.show { display: block; }
        .loading-text { color: #fff; font-size: 14px; margin-top: 12px; }
        .loading-spinner { width: 36px; height: 36px; border: 3px solid rgba(180,107,255,0.15); border-top-color: #b46bff; border-radius: 50%; margin: 0 auto; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui-container">
        <h3>Reparador NVIDIA IA 3D</h3>
        <input type="file" id="file-input" accept=".glb,.gltf">
        
        <div class="control-group">
            <label>Ángulo de fusión <span class="value-display" id="angle-val">15°</span></label>
            <input type="range" id="angle-slider" min="1" max="45" step="1" value="15">
        </div>
        <div class="control-group">
            <label>Grosor base <span class="value-display" id="thickness-val">0.05</span></label>
            <input type="range" id="thickness-slider" min="0.01" max="0.3" step="0.01" value="0.05">
        </div>

        <button id="ai-btn" class="ai-btn" disabled>⚡ REPARAR Y FUSIONAR CON IA</button>
        <button id="build-btn" disabled>CONSTRUIR CÁSCARA BASE</button>
        <button id="toggle-btn" class="secondary" disabled>VER MODELO ORIGINAL</button>
        
        <div class="stats">
            <div class="stat-row"><span class="stat-label">Bloques actuales:</span><span class="stat-value" id="block-count">0</span></div>
            <div class="stat-row"><span class="stat-label">Bloques tras IA:</span><span class="stat-value" id="ai-block-count">0</span></div>
            <div class="stat-row"><span class="stat-label">Estado IA:</span><span class="stat-value" id="status-info" style="font-size: 12px;">Esperando...</span></div>
        </div>
    </div>
    
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loading-text">Analizando geometría...</div>
    </div>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Configuración de la API de NVIDIA
        const API_URL = "https://integrate.api.nvidia.com/v1/chat/completions";
        const API_KEY = "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";
        const MODEL_NAME = "z-ai/glm-5.2";

        let scene, camera, renderer, controls, originalModel = null, instancedBoxes = null;
        let showingOriginal = true, totalTriangles = 0, modelBBox = null;
        let rawBoxesData = []; 

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f0f1a);
            scene.fog = new THREE.Fog(0x0f0f1a, 25, 80);
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(12, 10, 18);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.05;

            scene.add(new THREE.AmbientLight(0x404060, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
            dirLight.position.set(15, 25, 10); dirLight.castShadow = true;
            dirLight.shadow.mapSize.set(2048, 2048);
            scene.add(dirLight);
            const fill = new THREE.DirectionalLight(0x4488ff, 0.8); fill.position.set(-15, 10, -10); scene.add(fill);
            const rim = new THREE.DirectionalLight(0xff4488, 0.6); rim.position.set(0, -5, -15); scene.add(rim);

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x05050a, roughness: 0.9 }));
            floor.rotation.x = -Math.PI / 2; floor.position.y = -8; floor.receiveShadow = true; scene.add(floor);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
            });

            document.getElementById('file-input').addEventListener('change', handleFileUpload);
            document.getElementById('build-btn').addEventListener('click', buildWithCubes);
            document.getElementById('toggle-btn').addEventListener('click', toggleView);
            document.getElementById('ai-btn').addEventListener('click', repairWithAI);
            
            document.getElementById('angle-slider').addEventListener('input', (e) => document.getElementById('angle-val').innerText = e.target.value + "°");
            document.getElementById('thickness-slider').addEventListener('input', (e) => document.getElementById('thickness-val').innerText = parseFloat(e.target.value).toFixed(2));
        }

        async function repairWithAI() {
            if (rawBoxesData.length === 0) return alert("Primero carga un modelo y construye la cáscara base.");

            showLoading("La IA de NVIDIA está analizando imperfecciones...");
            
            const areas = rawBoxesData.map(b => b.width * b.height);
            const avgArea = areas.reduce((a, b) => a + b, 0) / areas.length;
            
            const prompt = `
                Eres un motor de optimización de geometría 3D. Tienes ${rawBoxesData.length} bloques.
                El área promedio de los bloques es ${avgArea.toFixed(3)}.
                Hay bloques muy pequeños que son imperfecciones (ruido geométrico) y deberían fusionarse o eliminarse.
                Devuelve EXCLUSIVAMENTE un JSON válido, sin texto adicional, sin markdown:
                {
                    "merge_coplanar": true,
                    "min_area_threshold": (valor numérico, bloques más pequeños que esto se consideran imperfecciones),
                    "analysis": "Breve texto de qué reparaste"
                }
            `;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'Authorization': `Bearer ${API_KEY}` 
                    },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        messages: [{ role: "user", content: prompt }],
                        temperature: 1,
                        top_p: 1,
                        max_tokens: 16384,
                        seed: 42,
                        stream: false
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error("Error de API (Texto):", errorText);
                    throw new Error(`HTTP ${response.status}: ${errorText.substring(0, 150)}`);
                }
                
                const data = await response.json();
                const aiText = data.choices[0].message.content;
                
                const jsonMatch = aiText.match(/\{[\s\S]*\}/);
                if (!jsonMatch) {
                    throw new Error("La IA no devolvió un JSON válido. Respondió: " + aiText.substring(0, 100));
                }
                
                const rules = JSON.parse(jsonMatch[0]);
                document.getElementById('status-info').innerText = rules.analysis.substring(0, 30) + "...";
                
                applyAIReparation(rules);
                hideLoading();
            } catch (error) {
                console.error("Error IA completo:", error);
                hideLoading();
                if (error.message.includes("Failed to fetch")) {
                    alert("Error de red o CORS. El navegador bloqueó la conexión a NVIDIA. Asegúrate de tener internet.");
                } else {
                    alert("Error de la IA: " + error.message);
                }
            }
        }

        function applyAIReparation(rules) {
            showLoading("Fusionando bloques y reparando...");
            setTimeout(() => {
                let cleanedBoxes = [...rawBoxesData];
                
                if (rules.min_area_threshold) {
                    cleanedBoxes = cleanedBoxes.filter(b => (b.width * b.height) >= rules.min_area_threshold);
                }

                if (rules.merge_coplanar) {
                    const merged = [];
                    const used = new Array(cleanedBoxes.length).fill(false);
                    
                    for (let i = 0; i < cleanedBoxes.length; i++) {
                        if (used[i]) continue;
                        let group = [cleanedBoxes[i]];
                        used[i] = true;
                        
                        for (let j = i + 1; j < cleanedBoxes.length; j++) {
                            if (used[j]) continue;
                            const b2 = cleanedBoxes[j];
                            const sameDir = cleanedBoxes[i].normal.dot(b2.normal) > 0.99;
                            const closeDist = cleanedBoxes[i].center.distanceTo(b2.center) < (Math.max(cleanedBoxes[i].width, cleanedBoxes[i].height) + Math.max(b2.width, b2.height));
                            
                            if (sameDir && closeDist) {
                                group.push(b2);
                                used[j] = true;
                            }
                        }
                        
                        if (group.length > 1) {
                            const box3 = new THREE.Box3();
                            group.forEach(b => {
                                const min = b.center.clone().sub(new THREE.Vector3(b.width/2, b.height/2, b.thickness/2));
                                const max = b.center.clone().add(new THREE.Vector3(b.width/2, b.height/2, b.thickness/2));
                                box3.expandByPoint(min); box3.expandByPoint(max);
                            });
                            const size = new THREE.Vector3(); box3.getSize(size);
                            const center = new THREE.Vector3(); box3.getCenter(center);
                            merged.push({
                                width: size.x, height: size.y, thickness: size.z,
                                center: center, normal: group[0].normal,
                                bestX: group[0].bestX, bestY: group[0].bestY
                            });
                        } else {
                            merged.push(group[0]);
                        }
                    }
                    cleanedBoxes = merged;
                }

                if (instancedBoxes) { scene.remove(instancedBoxes); instancedBoxes.geometry.dispose(); instancedBoxes.material.dispose(); }
                
                const matrices = [];
                const colors = [];
                const color = new THREE.Color();
                const minY = modelBBox.min.y;
                const heightRange = modelBBox.max.y - modelBBox.min.y;

                cleanedBoxes.forEach(b => {
                    const matrix = new THREE.Matrix4();
                    matrix.makeBasis(b.bestX, b.bestY, b.normal);
                    matrix.setPosition(b.center);
                    const gap = 0.98;
                    const scaleM = new THREE.Matrix4().makeScale(b.width * gap, b.height * gap, b.thickness);
                    matrix.multiply(scaleM);
                    matrices.push(matrix);

                    const t = heightRange > 0 ? (b.center.y - minY) / heightRange : 0.5;
                    const hue = (0.66 - t * 0.66 + 1.0) % 1.0;
                    color.setHSL(hue, 0.85, 0.55);
                    colors.push(color.r, color.g, color.b);
                });

                const boxGeom = new THREE.BoxGeometry(1, 1, 1);
                const boxMat = new THREE.MeshStandardMaterial({ roughness: 0.35, metalness: 0.3 });
                instancedBoxes = new THREE.InstancedMesh(boxGeom, boxMat, matrices.length);
                instancedBoxes.castShadow = true; instancedBoxes.receiveShadow = true;

                for (let i = 0; i < matrices.length; i++) {
                    instancedBoxes.setMatrixAt(i, matrices[i]);
                    const c = new THREE.Color(colors[i*3], colors[i*3+1], colors[i*3+2]);
                    instancedBoxes.setColorAt(i, c);
                }
                instancedBoxes.instanceMatrix.needsUpdate = true;
                if (instancedBoxes.instanceColor) instancedBoxes.instanceColor.needsUpdate = true;
                scene.add(instancedBoxes);

                document.getElementById('ai-block-count').innerText = matrices.length.toLocaleString();
                document.getElementById('status-info').innerText = "Reparado";
                hideLoading();
            }, 100);
        }

        function handleFileUpload(event) {
            const file = event.target.files[0]; 
            if (!file) return;
            
            const isGLTF = file.name.toLowerCase().endsWith('.gltf');
            showLoading("Cargando modelo...");
            const reader = new FileReader();
            
            if (isGLTF) {
                reader.onload = (e) => loadGLB(e.target.result);
                reader.readAsText(file);
            } else {
                reader.onload = (e) => loadGLB(e.target.result);
                reader.readAsArrayBuffer(file);
            }
        }

        function loadGLB(buffer) {
            const loader = new GLTFLoader();
            loader.parse(buffer, '', (gltf) => {
                if (originalModel) scene.remove(originalModel);
                originalModel = gltf.scene;
                modelBBox = new THREE.Box3().setFromObject(originalModel);
                const center = modelBBox.getCenter(new THREE.Vector3());
                const size = modelBBox.getSize(new THREE.Vector3());
                
                if (size.x === 0 && size.y === 0 && size.z === 0) {
                    hideLoading();
                    alert("El modelo 3D parece estar vacío o no tiene geometría válida.");
                    return;
                }

                const scale = 10 / Math.max(size.x, size.y, size.z);
                originalModel.position.copy(center).multiplyScalar(-scale);
                originalModel.scale.setScalar(scale);
                originalModel.updateMatrixWorld(true);
                
                totalTriangles = 0;
                originalModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true; child.receiveShadow = true;
                        totalTriangles += child.geometry.index ? child.geometry.index.count / 3 : child.geometry.attributes.position.count / 3;
                    }
                });
                scene.add(originalModel);
                
                document.getElementById('build-btn').disabled = false;
                document.getElementById('ai-btn').disabled = false;
                document.getElementById('toggle-btn').disabled = false;
                showingOriginal = true;
                hideLoading();
                buildWithCubes(); 
            }, (error) => {
                console.error("Error al cargar el modelo:", error);
                hideLoading(); 
                alert("Error al cargar el modelo. Puede que el archivo esté corrupto o no sea un .glb/.gltf válido.");
            });
        }

        function buildWithCubes() {
            if (!originalModel) return;
            showLoading("Generando cáscara base...");
            setTimeout(() => { doBuild(); hideLoading(); }, 50);
        }

        function doBuild() {
            const baseThickness = parseFloat(document.getElementById('thickness-slider').value);
            const mergeAngle = parseFloat(document.getElementById('angle-slider').value);
            const mergeThreshold = Math.cos(THREE.MathUtils.degToRad(mergeAngle));

            const triangles = [];
            originalModel.updateMatrixWorld(true);
            function getVertexHash(v) { return `${Math.round(v.x*1000)}_${Math.round(v.y*1000)}_${Math.round(v.z*1000)}`; }

            originalModel.traverse((child) => {
                if (child.isMesh) {
                    const geom = child.geometry.clone(); geom.applyMatrix4(child.matrixWorld);
                    const pos = geom.attributes.position.array; const ind = geom.index ? geom.index.array : null;
                    const num = ind ? ind.length / 3 : pos.length / 9;
                    for (let i = 0; i < num; i++) {
                        let i1, i2, i3;
                        if (ind) { i1 = ind[i*3]*3; i2 = ind[i*3+1]*3; i3 = ind[i*3+2]*3; } else { i1 = i*9; i2 = i*9+3; i3 = i*9+6; }
                        const v1 = new THREE.Vector3(pos[i1], pos[i1+1], pos[i1+2]);
                        const v2 = new THREE.Vector3(pos[i2], pos[i2+1], pos[i2+2]);
                        const v3 = new THREE.Vector3(pos[i3], pos[i3+1], pos[i3+2]);
                        const normal = new THREE.Vector3().subVectors(v2, v1).cross(new THREE.Vector3().subVectors(v3, v1)).normalize();
                        triangles.push({ v1, v2, v3, normal, h1: getVertexHash(v1), h2: getVertexHash(v2), h3: getVertexHash(v3) });
                    }
                    geom.dispose();
                }
            });

            const edgeMap = new Map();
            function addEdge(h1, h2, i) { const k = h1 < h2 ? `${h1}_${h2}` : `${h2}_${h1}`; if (!edgeMap.has(k)) edgeMap.set(k, []); edgeMap.get(k).push(i); }
            triangles.forEach((t, i) => { addEdge(t.h1, t.h2, i); addEdge(t.h2, t.h3, i); addEdge(t.h3, t.h1, i); });

            const visited = new Array(triangles.length).fill(false);
            const patches = [];
            for (let i = 0; i < triangles.length; i++) {
                if (visited[i]) continue;
                const queue = [i]; visited[i] = true; const patchTris = [i];
                while (queue.length > 0) {
                    const curr = queue.shift(); const t = triangles[curr];
                    const edges = [t.h1<t.h2?`${t.h1}_${t.h2}`:`${t.h2}_${t.h1}`, t.h2<t.h3?`${t.h2}_${t.h3}`:`${t.h3}_${t.h2}`, t.h3<t.h1?`${t.h3}_${t.h1}`:`${t.h1}_${t.h3}`];
                    for (const edge of edges) {
                        const neighbors = edgeMap.get(edge); if (!neighbors) continue;
                        for (const nIdx of neighbors) {
                            if (nIdx === curr || visited[nIdx]) continue;
                            if (t.normal.dot(triangles[nIdx].normal) > mergeThreshold) { visited[nIdx] = true; patchTris.push(nIdx); queue.push(nIdx); }
                        }
                    }
                }
                patches.push(patchTris);
            }

            rawBoxesData = []; 
            const matrices = []; const colors = []; const color = new THREE.Color();
            const minY = modelBBox.min.y; const heightRange = modelBBox.max.y - modelBBox.min.y;

            for (const patch of patches) {
                const verts = new Map(); const edgeDirs = new Set();
                for (const triIdx of patch) {
                    const t = triangles[triIdx];
                    verts.set(t.h1, t.v1); verts.set(t.h2, t.v2); verts.set(t.h3, t.v3);
                    [[t.v1, t.v2], [t.v2, t.v3], [t.v3, t.v1]].forEach(([p1, p2]) => {
                        const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
                        edgeDirs.add(`${Math.round(dir.x*100)}_${Math.round(dir.y*100)}_${Math.round(dir.z*100)}`);
                    });
                }
                const vertArray = Array.from(verts.values()); if (vertArray.length < 3) continue;

                let avgNormal = new THREE.Vector3();
                for (const triIdx of patch) avgNormal.add(triangles[triIdx].normal);
                avgNormal.normalize(); const Z = avgNormal;

                let bestArea = Infinity, bestX = new THREE.Vector3(1,0,0), bestY = new THREE.Vector3(0,1,0);
                let minU = Infinity, maxU = -Infinity, minV = Infinity, maxV = -Infinity;

                for (const dirHash of edgeDirs) {
                    const parts = dirHash.split('_').map(Number);
                    const dir = new THREE.Vector3(parts[0]/100, parts[1]/100, parts[2]/100);
                    if (dir.lengthSq() < 0.5) continue;
                    const projDir = dir.clone().sub(Z.clone().multiplyScalar(dir.dot(Z))).normalize();
                    if (projDir.lengthSq() < 0.1) continue;
                    const X = projDir; const Y = new THREE.Vector3().crossVectors(Z, X).normalize();
                    let cu=Infinity, xu=-Infinity, cv=Infinity, xv=-Infinity;
                    for (const v of vertArray) { const u=v.dot(X), vv=v.dot(Y); if(u<cu)cu=u; if(u>xu)xu=u; if(vv<cv)cv=vv; if(vv>xv)xv=vv; }
                    const area = (xu - cu) * (xv - cv);
                    if (area < bestArea) { bestArea=area; bestX=X; bestY=Y; minU=cu; maxU=xu; minV=cv; maxV=xv; }
                }

                const width = maxU - minU; const height = maxV - minV;
                if (width <= 0 || height <= 0) continue;
                const area = width * height;
                const adaptiveT = baseThickness * (1.0 + Math.sqrt(area) * 0.3);
                const finalT = Math.min(adaptiveT, Math.min(width, height) * 0.8);

                const centerU = (minU + maxU) / 2; const centerV = (minV + maxV) / 2;
                const planeDist = vertArray[0].dot(Z);
                const center = new THREE.Vector3().add(bestX.clone().multiplyScalar(centerU)).add(bestY.clone().multiplyScalar(centerV)).add(Z.clone().multiplyScalar(planeDist));

                rawBoxesData.push({ width, height, thickness: finalT, center: center.clone(), normal: Z.clone(), bestX: bestX.clone(), bestY: bestY.clone() });

                const matrix = new THREE.Matrix4(); matrix.makeBasis(bestX, bestY, Z); matrix.setPosition(center);
                const scaleM = new THREE.Matrix4().makeScale(width * 0.98, height * 0.98, finalT);
                matrix.multiply(scaleM); matrices.push(matrix);

                const t = heightRange > 0 ? (center.y - minY) / heightRange : 0.5;
                color.setHSL((0.66 - t * 0.66 + 1.0) % 1.0, 0.85, 0.55);
                colors.push(color.r, color.g, color.b);
            }

            if (instancedBoxes) { scene.remove(instancedBoxes); instancedBoxes.geometry.dispose(); instancedBoxes.material.dispose(); }
            const boxGeom = new THREE.BoxGeometry(1, 1, 1);
            const boxMat = new THREE.MeshStandardMaterial({ roughness: 0.35, metalness: 0.3 });
            instancedBoxes = new THREE.InstancedMesh(boxGeom, boxMat, matrices.length);
            instancedBoxes.castShadow = true; instancedBoxes.receiveShadow = true;
            for (let i = 0; i < matrices.length; i++) {
                instancedBoxes.setMatrixAt(i, matrices[i]);
                instancedBoxes.setColorAt(i, new THREE.Color(colors[i*3], colors[i*3+1], colors[i*3+2]));
            }
            instancedBoxes.instanceMatrix.needsUpdate = true;
            if (instancedBoxes.instanceColor) instancedBoxes.instanceColor.needsUpdate = true;
            scene.add(instancedBoxes);

            originalModel.visible = false; instancedBoxes.visible = true; showingOriginal = false;
            document.getElementById('block-count').innerText = matrices.length.toLocaleString();
            document.getElementById('ai-block-count').innerText = "0";
            document.getElementById('toggle-btn').innerText = "VER MODELO ORIGINAL";
        }

        function toggleView() {
            if (!originalModel) return;
            showingOriginal = !showingOriginal;
            originalModel.visible = showingOriginal;
            if (instancedBoxes) instancedBoxes.visible = !showingOriginal;
            document.getElementById('toggle-btn').innerText = showingOriginal ? "VER CÁSCARA" : "VER MODELO ORIGINAL";
        }

        function showLoading(text) { document.getElementById('loading-text').innerText = text; document.getElementById('loading').classList.add('show'); }
        function hideLoading() { document.getElementById('loading').classList.remove('show'); }
        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
    </script>
</body>
</html>
